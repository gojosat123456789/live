<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      color-scheme: dark;
      --ink: #080d0c;
      --paper: #f1eee5;
      --muted: #a9aca2;
      --green: #a5c88a;
      --gold: #d5b978;
      --line: rgba(238, 236, 222, .13);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 77% 19%, rgba(79, 111, 75, .16), transparent 34rem), var(--ink);
      color: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1080px, calc(100% - 48px)); margin: 0 auto; }
    .topbar { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 12px; font-weight: 650; letter-spacing: .19em; text-transform: uppercase; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid rgba(213, 185, 120, .55); border-radius: 50%; color: var(--gold); font: 17px var(--serif); letter-spacing: 0; }
    .back-link { color: #d7d7ca; font-size: 12px; }
    .back-link:hover, .back-link:focus-visible { color: var(--green); }
    .hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 56px; padding-top: 75px; padding-bottom: 82px; perspective: 1300px; }
    .eyebrow { color: var(--green); font-size: 10px; font-weight: 650; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 21px 0 18px; font: 400 clamp(44px, 6vw, 72px)/1.02 var(--serif); letter-spacing: -.05em; }
    .intro { max-width: 490px; margin: 0; color: #b4b7ad; font-size: 14px; line-height: 1.9; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 27px; }
    .button { min-height: 47px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 18px; border: 1px solid var(--gold); border-radius: 3px; background: var(--gold); color: #11140f; font-size: 12px; font-weight: 700; transition: transform .2s ease, background .2s ease; }
    .button:hover, .button:focus-visible { transform: translateY(-2px); background: #e2cb96; }
    .button.secondary { background: transparent; color: var(--paper); border-color: var(--line); }
    .button.secondary:hover, .button.secondary:focus-visible { border-color: var(--green); color: var(--green); background: transparent; }
    .visual-wrap { perspective: 1100px; }
    .visual {
      position: relative;
      min-height: 380px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(213, 185, 120, .34);
      background: radial-gradient(ellipse at 50% 35%, var(--glow), transparent 65%), #111714;
      box-shadow: 20px 25px 0 rgba(213, 185, 120, .035), 0 35px 75px rgba(0, 0, 0, .34);
      transform: rotateY(-5deg) rotateX(2deg);
      transform-style: preserve-3d;
      transition: transform .25s ease-out;
    }
    .visual::before, .visual::after { position: absolute; width: 240px; height: 240px; border: 1px solid rgba(241, 238, 229, .12); border-radius: 50%; content: ""; transform: translateZ(5px); }
    .visual::after { width: 310px; height: 310px; border-style: dashed; opacity: .55; }
    .visual svg { z-index: 1; width: 84%; max-height: 325px; filter: drop-shadow(0 22px 22px rgba(0, 0, 0, .28)); transform: translateZ(38px); }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .meta-item { padding: 20px 22px; border-right: 1px solid var(--line); }
    .meta-item:last-child { border-right: 0; }
    .meta-item span { display: block; margin-bottom: 8px; color: var(--muted); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
    .meta-item strong { color: #e6e4da; font-size: 12px; font-weight: 500; }
    .details { display: grid; grid-template-columns: .8fr 1.2fr; gap: 64px; padding: 76px 0 85px; }
    .kicker { color: var(--gold); font-size: 10px; font-weight: 650; letter-spacing: .2em; text-transform: uppercase; }
    h2 { margin: 13px 0 0; font: 400 clamp(33px, 4vw, 48px)/1.1 var(--serif); letter-spacing: -.035em; }
    .details-copy p { margin: 0 0 15px; color: #b4b7ad; font-size: 13px; line-height: 1.9; }
    .details-copy h3 { margin: 24px 0 13px; font: 400 22px var(--serif); }
    .deliverables { display: flex; flex-wrap: wrap; gap: 9px; }
    .deliverables span { padding: 9px 11px; border: 1px solid var(--line); color: #deddd2; font-size: 10px; }
    .cta { display: flex; align-items: center; justify-content: space-between; gap: 28px; margin-bottom: 78px; padding: 30px; border: 1px solid rgba(213, 185, 120, .28); background: linear-gradient(135deg, rgba(213, 185, 120, .07), rgba(255, 255, 255, .012)); }
    .cta h2 { font-size: clamp(30px, 4vw, 42px); }
    .cta p { max-width: 540px; margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 1.8; }
    footer { display: flex; justify-content: space-between; gap: 14px; padding: 20px 0 25px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    footer a { color: var(--gold); }
    .not-found { min-height: 65vh; display: grid; align-content: center; justify-items: start; }
    .not-found p { color: var(--muted); line-height: 1.8; }
    @media (max-width: 720px) {
      .shell { width: min(100% - 38px, 560px); }
      .topbar { min-height: 68px; }
      .brand { font-size: 10px; letter-spacing: .12em; }
      .back-link { font-size: 11px; }
      .hero { grid-template-columns: 1fr; gap: 35px; padding-top: 54px; padding-bottom: 55px; }
      .visual { min-height: 300px; }
      .visual svg { max-height: 260px; }
      .details { grid-template-columns: 1fr; gap: 22px; padding: 58px 0; }
      .meta-item { padding: 16px 10px; }
      .meta-item strong { font-size: 10px; }
      .cta { align-items: flex-start; flex-direction: column; margin-bottom: 55px; padding: 22px 18px; }
      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .visual { transform: none; }
    }
  </style>
</head>

      backLink.href = isService ? "index.html#services" : "index.html#work";
      backLink.textContent = isService ? "← Back to all services" : "← Back to all projects";
      content.style.setProperty("--glow", item.glow);

      const hero = document.createElement("section");
      hero.className = "hero";
      const copy = document.createElement("div");
      const kicker = document.createElement("span");
      kicker.className = "eyebrow";
      kicker.textContent = isService ? `Design service · ${item.category}` : `Selected concept · ${item.category}`;
      const heading = document.createElement("h1");
      heading.textContent = item.title;
      const intro = document.createElement("p");
      intro.className = "intro";
      intro.textContent = item.description;
      const actions = document.createElement("div");
      actions.className = "hero-actions";
      const hire = document.createElement("a");
      hire.className = "button";
      hire.href = `https://wa.me/923068778018?text=${encodeURIComponent(isService
        ? `Hello Ashan, I'm interested in your ${item.title} service. My business/project is: [add details]. Please let me know the price and next steps.`
        : `Hello Ashan, I'd like to discuss a ${item.category.toLowerCase()} design similar to "${item.title}". Please share the next steps and a quote.`)}`;
      hire.target = "_blank";
      hire.rel = "noopener noreferrer";
      hire.textContent = isService ? "Request this service ↗" : "Request a similar design ↗";
      const back = document.createElement("a");
      back.className = "button secondary";
      back.href = isService ? "index.html#services" : "index.html#work";
      back.textContent = isService ? "All services" : "All projects";
      actions.append(hire, back);
      copy.append(kicker, heading, intro, actions);

      const visualWrap = document.createElement("div");
      visualWrap.className = "visual-wrap";
      const visual = document.createElement("div");
      visual.className = "visual";
      visual.append(createArtwork(item));
      visualWrap.append(visual);
      hero.append(copy, visualWrap);

      const meta = document.createElement("div");
      meta.className = "meta";
      [[isService ? "Service" : "Project type", item.category], ["Designer", "Ashan Raza"], ["Enquiries", "Custom quote"]].forEach(([label, value]) => {
        const entry = document.createElement("div");
        entry.className = "meta-item";
        const name = document.createElement("span");
        name.textContent = label;
        const detail = document.createElement("strong");
        detail.textContent = value;
        entry.append(name, detail);
        meta.append(entry);
      });

      const details = document.createElement("section");
      details.className = "details";
      const detailHeading = document.createElement("div");
      const detailKicker = document.createElement("span");
      detailKicker.className = "kicker";
      detailKicker.textContent = isService ? "How it works" : "Project overview";
      const overviewTitle = document.createElement("h2");
      overviewTitle.textContent = isService ? "A design made for your business." : "A visual idea, made with purpose.";
      detailHeading.append(detailKicker, overviewTitle);
      const detailCopy = document.createElement("div");
      detailCopy.className = "details-copy";
      const paragraph = document.createElement("p");
      paragraph.textContent = item.objective;
      const note = document.createElement("p");
      note.textContent = isService
        ? "Send your business details, any design references, and your preferred deadline. Ashan will review your brief and confirm the scope, timing, and custom quote before work begins."
        : "This is an original portfolio concept sample, not commissioned client work. The design direction can be adapted to your business and brief.";
      const listHeading = document.createElement("h3");
      listHeading.textContent = isService ? "What you can request" : "Possible deliverables";
      const list = document.createElement("div");
      list.className = "deliverables";
      item.deliverables.forEach((deliverable) => {
        const tag = document.createElement("span");
        tag.textContent = deliverable;
        list.append(tag);
      });
      detailCopy.append(paragraph, note, listHeading, list);
      details.append(detailHeading, detailCopy);

      const cta = document.createElement("section");
      cta.className = "cta";
      const ctaCopy = document.createElement("div");
      const ctaHeading = document.createElement("h2");
      ctaHeading.textContent = isService ? `Need ${item.title.toLowerCase()} for your business?` : "Have a similar project in mind?";
      const ctaText = document.createElement("p");
      ctaText.textContent = isService
        ? "Tap below to open WhatsApp with your chosen service already included. Add a few details about your business to request a custom quote."
        : "Send a few details on WhatsApp to discuss the scope, timeline, and a custom quote. There is no fixed package price.";
      ctaCopy.append(ctaHeading, ctaText);
      const ctaButton = hire.cloneNode(true);
      ctaButton.textContent = isService ? "Get a quote on WhatsApp ↗" : "Discuss your project ↗";
      cta.append(ctaCopy, ctaButton);

      content.append(hero, meta, details, cta);

      const portrait = content.querySelector(".visual");
      portrait.addEventListener("pointermove", (event) => {
        if (event.pointerType === "touch" || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const bounds = portrait.getBoundingClientRect();
        const x = (event.clientX - bounds.left) / bounds.width - 0.5;
        const y = (event.clientY - bounds.top) / bounds.height - 0.5;
        portrait.style.transform = `rotateY(${-5 + x * 10}deg) rotateX(${2 - y * 8}deg)`;
      });
      portrait.addEventListener("pointerleave", () => { portrait.style.transform = ""; });
    }

    if (item) renderProject(item, isService);
    else showNotFound();
  </script>
</body>
</html>
