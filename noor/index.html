<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Noor ❤️</title>

<style>
body {
  background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
  height: 100vh;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 0 30px rgba(255,0,0,0.3);
}

h1 {
  color: #e6005c;
}

button {
  padding: 12px 30px;
  font-size: 18px;
  margin: 15px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #ccc;
  position: absolute;
}
</style>
</head>

<body>

<div class="card">
  <h1>💖 Noor 💖</h1>
  <h2>Can we talk like friends?</h2>

  <button id="yes" onclick="yesClick()">YES ❤️</button>
  <button id="no" onmouseover="moveNo()">NO 💔</button>
</div>

<script>
function moveNo() {
  let x = Math.random() * (window.innerWidth - 100);
  let y = Math.random() * (window.innerHeight - 50);
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}

function yesClick() {
  document.body.innerHTML = `
    <div style="text-align:center; margin-top:100px;">
      <h1 style="color:#e6005c;">💌 Dear Noor 💌</h1>
      <p style="font-size:22px;">
        From the moment you came into my life,<br>
        everything started feeling beautiful ❤️<br><br>
        Will you be mine forever? 🌹
      </p>
    </div>
  `;
}
</script>

</body>
</html>
